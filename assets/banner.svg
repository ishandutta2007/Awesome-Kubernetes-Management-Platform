<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      
      /* Dynamic Animations */
      @keyframes pulse-orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float-node {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes wave-pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }

      .rotating-group {
        transform-origin: 1020px 180px;
        animation: pulse-orbit 40s linear infinite;
      }
      .floating-node-1 {
        animation: float-node 4s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: float-node 5s ease-in-out 1s infinite;
      }
      .pulsing-ring {
        transform-origin: 1020px 180px;
        animation: wave-pulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid Background Pattern -->
  <g opacity="0.07">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M40 0V360 M80 0V360 M120 0V360 M160 0V360 M200 0V360 M240 0V360 M280 0V360 M320 0V360 M360 0V360 M400 0V360 M440 0V360 M480 0V360 M520 0V360 M560 0V360 M600 0V360 M640 0V360 M680 0V360 M720 0V360 M760 0V360 M800 0V360 M840 0V360 M880 0V360 M920 0V360 M960 0V360 M1000 0V360 M1040 0V360 M1080 0V360 M1120 0V360 M1160 0V360" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow-strong)"/>
  <circle cx="1020" cy="180" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow-strong)"/>

  <!-- Dynamic Graphic Elements (Right Side - Behind text in visual hierarchy) -->
  <g class="pulsing-ring">
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="1020" cy="180" r="95" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
  </g>

  <g class="rotating-group">
    <!-- Orbital Nodes -->
    <circle cx="1020" cy="50" r="7" fill="#38bdf8" filter="url(#glow-light)"/>
    <line x1="1020" y1="50" x2="1020" y2="180" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

    <circle cx="1150" cy="180" r="9" fill="#c084fc" filter="url(#glow-light)"/>
    <line x1="1150" y1="180" x2="1020" y2="180" stroke="#c084fc" stroke-width="1" opacity="0.2"/>

    <circle cx="920" cy="240" r="6" fill="#818cf8" filter="url(#glow-light)"/>
    <line x1="920" y1="240" x2="1020" y2="180" stroke="#818cf8" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Central Kubernetes Wheel Symbol Graphic (Right side) -->
  <g transform="translate(1020, 180)" class="floating-node-1">
    <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="3" filter="url(#glow-light)"/>
    <!-- K8s Wheel Spikes -->
    <path d="M0 -30 L0 -18 M0 18 L0 30 M-30 0 L-18 0 M18 0 L30 0 M-21 -21 L-12 -12 M12 12 L21 21 M-21 21 L-12 12 M12 -12 L21 -21" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8"/>
  </g>

  <!-- Cluster Network Nodes Floating -->
  <g class="floating-node-2">
    <g transform="translate(860, 100)">
      <rect x="-35" y="-18" width="70" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold" text-anchor="middle">GitOps</text>
    </g>

    <g transform="translate(880, 260)">
      <rect x="-45" y="-18" width="90" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="5" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold" text-anchor="middle">Multi-Cluster</text>
    </g>
  </g>

  <!-- Decorative Line Separator Left -->
  <rect x="70" y="62" width="160" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="84" cy="75" r="5" fill="#38bdf8" filter="url(#glow-light)"/>
  <text x="96" y="80" class="badge-text">KUBERNETES ECOSYSTEM</text>

  <!-- Foreground Content (Title & Subtitle) -->
  <g transform="translate(70, 0)">
    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Kubernetes</text>
    <text x="0" y="195" class="title" fill="url(#primary-grad)">Management Platforms ☸️</text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle">Curated Guide to Enterprise SaaS & Open-Source Management Platforms</text>
    <text x="0" y="265" class="subtitle">Multi-Cluster Orchestration • GitOps • Lifecycle • Platform Engineering</text>

    <!-- Bottom Highlights / Tags -->
    <g transform="translate(0, 298)">
      <rect x="0" y="0" width="115" height="24" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="57.5" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">⚡ 2026 Edition</text>

      <rect x="125" y="0" width="135" height="24" rx="12" fill="#1e293b" stroke="#4f46e5" stroke-width="1"/>
      <text x="192.5" y="16" font-family="sans-serif" font-size="11" fill="#818cf8" font-weight="600" text-anchor="middle">📊 SaaS Pricing & Limit</text>

      <rect x="270" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#9333ea" stroke-width="1"/>
      <text x="335" y="16" font-family="sans-serif" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">⭐ Open-Source Ranked</text>
    </g>
  </g>
</svg>
