<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <path d="M0 60H1200 M0 120H1200 M0 180H1200 M0 240H1200 M0 300H1200"/>
    <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360 M600 0V360 M700 0V360 M800 0V360 M900 0V360 M1000 0V360 M1100 0V360"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="160" fill="#0284c7" opacity="0.12"/>
  <circle cx="1000" cy="180" r="180" fill="#6366f1" opacity="0.15"/>

  <!-- Right Visual Graphics: Kubernetes Multi-Cluster Graphic -->
  <g transform="translate(980, 180)">
    <!-- Outer Orbit Rings with SMIL Dynamic Animations -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Satellite Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="25s" repeatCount="indefinite"/>
      <circle cx="0" cy="-120" r="8" fill="#38bdf8"/>
      <circle cx="120" cy="0" r="7" fill="#c084fc"/>
      <circle cx="-85" cy="85" r="6" fill="#818cf8"/>
    </g>

    <!-- Central K8s Wheel Symbol -->
    <circle cx="0" cy="0" r="50" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M0 -32 L0 -18 M0 18 L0 32 M-32 0 L-18 0 M18 0 L32 0 M-22 -22 L-12 -12 M12 12 L22 22 M-22 22 L-12 12 M12 -12 L22 -21" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#38bdf8"/>
  </g>

  <!-- Floating Feature Pills Right Side -->
  <g transform="translate(780, 90)">
    <rect width="110" height="34" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <text x="55" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="middle">GitOps Engine</text>
  </g>

  <g transform="translate(820, 245)">
    <rect width="130" height="34" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#818cf8" font-weight="bold" text-anchor="middle">Multi-Cluster Fleet</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 0)">
    <!-- Top Tag / Badge -->
    <g transform="translate(0, 58)">
      <rect width="175" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#38bdf8"/>
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="bold" letter-spacing="1">KUBERNETES ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#ffffff" font-weight="800" letter-spacing="-0.5">Awesome Kubernetes</text>
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="url(#title-grad)" font-weight="800" letter-spacing="-0.5">Management Platforms</text>

    <!-- Subtitle Lines -->
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="500">Curated Guide to Enterprise SaaS &amp; Open-Source Management Platforms</text>
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b" font-weight="500">Multi-Cluster Orchestration • GitOps • Lifecycle • Platform Engineering</text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 285)">
      <rect width="110" height="24" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="55" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">2026 Edition</text>

      <rect x="120" width="135" height="24" rx="12" fill="#1e293b" stroke="#4f46e5" stroke-width="1"/>
      <text x="187.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#818cf8" font-weight="600" text-anchor="middle">SaaS Pricing &amp; Limits</text>

      <rect x="265" width="130" height="24" rx="12" fill="#1e293b" stroke="#9333ea" stroke-width="1"/>
      <text x="330" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">Open-Source Ranked</text>
    </g>
  </g>
</svg>
